<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/product-des.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">

</head>
<body>

  <!-- ========================= NAVBAR ========================= -->
  <nav class="pd-navbar">
    <button class="nav-btn back-btn" onclick="history.back()">
      <i class="ri-arrow-left-line"></i>
    </button>

    <div class="nav-logo">
      <img src="images/logo.png" alt="Logo">
    </div>

    <button class="nav-btn cart-btn" onclick="window.location.href='cart.html'">
      <i class="ri-shopping-cart-2-line"></i>
    </button>
  </nav>

  <!-- ========================= MAIN CONTENT ========================= -->
  <main id="productContent">
<div id="loaderWrapper">
  <div class="neat-loader-box">
    <div class="neat-loader">
      <div class="bar bar1"></div>
      <div class="bar bar2"></div>
      <div class="bar bar3"></div>
    </div>

    <div class="loading-text">Loading...</div>
  </div>
</div>
  </main>


        <!-- FOOTER -->
<footer>
  <div class="footer-top">
    <!-- Quote -->
    <div class="footer-quote">
      <p>"Custom creations for your everyday lifestyle – Neat Customs."</p>
    </div>

    <!-- Logo -->
    <div class="footer-logo">
      <img src="images/logo.png" alt="Neat Customs Logo">
    </div>

    <!-- Social Media Icons -->
    <div class="footer-social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="Pinterest"><i class="fab fa-pinterest-p"></i></a>
    </div>
  </div>

  <!-- Separator -->
  <hr class="footer-separator">

  <!-- Legal -->
  <div class="footer-legal">
    <p>&copy; 2025 Neat Customs. All Rights Reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms & Conditions</a></p>
  </div>
</footer>

  <!-- Scripts -->
  <script src="firebase/product-des-firebase.js" type="module"></script>
  <script src="js/product-det.js" type="module"></script>

</body>
</html>
